<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
getSel() { return (this.state && this.state.sel) || { foto: true }; }
toggle(id) {
const n = Object.assign({}, this.getSel());
if (n[id]) { delete n[id]; } else { n[id] = true; }
this.setState({ sel: n });
}
renderVals() {
const sel = this.getSel();
const defs = [
['foto', 'Fotorealisme general', 'Llum, ombres, reflexos i textures', 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z'],
['veg', 'Vegetació', 'Arbres, arbustos i gespa', 'M5 19c0-8 5-13 14-14 0 9-5 14-13 14M5 19l7-7'],
['vid', 'Vidres', 'Transparència i reflexos', 'M4 4h16v16H4zM12 4v16M4 12h16'],
['mat', 'Materials', 'Textura i detall dels acabats', 'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5'],
['ill', 'Il·luminació', 'Hora del dia i ambient', 'M12 8a4 4 0 1 0 0 8 4 4 0 1 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5'],
['ent', 'Entorn', 'Paviments, voreres i cel', 'M3 20l6-10 4 6 3-4 5 8z'],
['int', 'Interiors visibles', 'El que es veu darrere les vidrieres', 'M5 21V4h9v17M14 8h5v13M2 21h20M10 12v2'],
['res', 'Resolució i nitidesa', 'Més claredat i detall', 'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M9 9h6v6H9z']
];
const cards = defs.map((x) => ({ title: x[1], desc: x[2], d: x[3], selected: !!sel[x[0]], unselected: !sel[x[0]], pick: () => this.toggle(x[0]) }));
const n = Object.keys(sel).length;
return { cards: cards, countText: n === 0 ? 'Cap selecció' : (n === 1 ? '1 selecció' : n + ' seleccions') };
}
}
</script>

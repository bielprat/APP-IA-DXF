[project]
name = "colomer-rifa-cad"
version = "0.1.0"
description = "Deterministic DXF 3D generation and validation service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "ezdxf>=1.4",
  "shapely>=2.0",
  "trimesh>=4.4",
  "numpy>=2.0",
  "pydantic>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

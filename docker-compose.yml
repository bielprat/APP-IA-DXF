name: colomer-rifa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cr}
      POSTGRES_DB: ${POSTGRES_DB:-colomer_rifa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cr}:${POSTGRES_PASSWORD:-cr}@postgres:5432/${POSTGRES_DB:-colomer_rifa}
    depends_on:
      postgres:
        condition: service_healthy

  cad:
    build:
      context: .
      dockerfile: services/cad/Dockerfile
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cr}:${POSTGRES_PASSWORD:-cr}@postgres:5432/${POSTGRES_DB:-colomer_rifa}
      CAD_SERVICE_URL: http://cad:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      cad:
        condition: service_healthy

volumes:
  postgres-data:
